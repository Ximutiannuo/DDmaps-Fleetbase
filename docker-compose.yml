x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  cache:
    image: redis:4-alpine
    <<: *service-defaults
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    <<: *service-defaults
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "${DDMAPS_DB_ROOT_PASSWORD:?Run scripts/initialize-security.ps1 first}"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    <<: *service-defaults
    ports:
      - "127.0.0.1:38000:8000"
    environment:
      DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run scripts/initialize-security.ps1 first}"
    volumes:
      - ./docker/socket/server.js:/usr/src/server.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health-check',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    image: fleetbase/fleetbase-api:local
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["go-crond", "--verbose", "root:./crontab"]
    <<: *service-defaults
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/check-scheduler-health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ./api/.env:/fleetbase/api/.env:ro
      - ./api/storage/app:/fleetbase/api/storage/app
    environment:
      DATABASE_URL: "mysql://ddmaps_app:${DDMAPS_DB_APP_PASSWORD:?Run scripts/initialize-security.ps1 first}@database/fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      BROADCAST_DRIVER: socketcluster
      DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run scripts/initialize-security.ps1 first}"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:local
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    <<: *service-defaults
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./api/.env:/fleetbase/api/.env:ro
      - ./api/storage/app:/fleetbase/api/storage/app
    environment:
      DATABASE_URL: "mysql://ddmaps_app:${DDMAPS_DB_APP_PASSWORD:?Run scripts/initialize-security.ps1 first}@database/fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      BROADCAST_DRIVER: socketcluster
      DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run scripts/initialize-security.ps1 first}"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    <<: *service-defaults
    build:
      context: .
      dockerfile: console/Dockerfile
      args:
        ENVIRONMENT: production
        HTTP_PROXY: http://host.docker.internal:7897
        HTTPS_PROXY: http://host.docker.internal:7897
      secrets:
        - carto_api_key
    ports:
      - "4200:4200"
      - "127.0.0.1:4201:8080"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/secrets/tls:/etc/nginx/ssl

  application:
    <<: *service-defaults
    image: fleetbase/fleetbase-api:local
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "mysql://ddmaps_app:${DDMAPS_DB_APP_PASSWORD:?Run scripts/initialize-security.ps1 first}@database/fleetbase"
      APP_ENV: production
      APP_DEBUG: "false"
      SOCKETCLUSTER_HOST: socket
      SOCKETCLUSTER_PORT: 8000
      BROADCAST_DRIVER: socketcluster
      DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run scripts/initialize-security.ps1 first}"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: localhost
      MAIL_FROM_NAME: Fleetbase
      APP_NAME: Fleetbase
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
      CONSTRUCTION_SITE_DEFAULT_GATE_UUID: "${CONSTRUCTION_SITE_DEFAULT_GATE_UUID:-}"
    depends_on:
      - database
      - cache
      - queue

  httpd:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - application

  migration:
    profiles: [maintenance]
    extends:
      service: application
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      DATABASE_URL: "mysql://root:${DDMAPS_DB_ROOT_PASSWORD}@database/fleetbase"

secrets:
  carto_api_key:
    environment: CARTO_API_KEY
