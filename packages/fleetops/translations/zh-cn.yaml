                exists: 检查字段或值是否存在
                has: 检查对象是否具有特定属性或集合是否包含特定元素
                contains: 检查字符串是否包含另一个字符串，或数组是否包含特定元素
                begins-with: 检查字符串是否以指定子字符串开头
                ends-with: 检查字符串是否以指定子字符串结尾
                in: 检查值是否在给定集合或范围内
                not-in: 检查值是否不在给定集合或范围内
                and: 逻辑与，两个操作数都为真时为真
                or: 逻辑或，至少一个操作数为真时为真
                not: 逻辑非，反转真值
