                    逻辑与：所有条件为真时为真
                or: >-
                    逻辑或：至少一个条件为真时为真
                not: >-
                    逻辑非：反转条件的真值
                if: >-
                    条件逻辑：条件为真时执行以下操作
            operators:
                equal: 检查两个值是否相等
                not-equal: 检查两个值是否不相等
                greater-than: 检查值是否大于另一个值
                less-than: 检查值是否小于另一个值
                greater-than-or-equal: 检查值是否大于等于另一个值
