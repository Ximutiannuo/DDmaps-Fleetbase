        extension-icon-help-text: 上传代表扩展的图标，此图标将用于列表和搜索结果。
        extension-description-help-text: 提供扩展功能和主要特性的详细描述，帮助用户了解扩展的功能。
        extension-tags-help-text: 添加与扩展相关的关键词和标签，帮助用户通过搜索找到它。
        extension-promotional-text-help-text: 编写推广文案以突出扩展的独特卖点，此文本将用于营销或推荐区域。
        extension-subtitle-help-text: 提供简短的副标题，为扩展提供额外的上下文或信息。
        extension-website-url-help-text: 输入扩展官方网站或产品页面的链接以获取更多信息。
        extension-repo-url-help-text: 提供扩展代码仓库的链接（如GitHub、GitLab），如适用。
        extension-support-url-help-text: 指定用户可以获取支持、提问或报告扩展问题的链接。
        extension-privacy-policy-url-help-text: 链接到隐私政策文档，详细说明用户数据的处理和保护方式。
        extension-tos-url-help-text: 链接到服务条款文档，用户在使用扩展前必须同意。
        extension-primary-language-help-text: 指定扩展开发或可用的主要语言。
        extension-version-help-text: 指明扩展的当前版本，这对于跟踪更新和兼容性很重要。
