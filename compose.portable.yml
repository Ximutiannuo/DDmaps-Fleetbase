# Fresh-machine deployment. Always select this file explicitly; do not merge the local override.
name: ddmaps-portable

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  DATABASE_URL: "mysql://ddmaps_app:${DDMAPS_DB_APP_PASSWORD:?Run python portable/deploy.py init}@database/fleetbase"
  CACHE_DRIVER: redis
  CACHE_URL: tcp://cache
  CACHE_PATH: /fleetbase/api/storage/framework/cache
  REDIS_URL: tcp://cache
  REDIS_HOST: cache
  QUEUE_CONNECTION: redis
  BROADCAST_DRIVER: socketcluster
  SOCKETCLUSTER_HOST: socket
  SOCKETCLUSTER_PORT: 8000
  DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run python portable/deploy.py init}"
  CONSOLE_HOST: "${CONSOLE_HOST:-https://localhost:4200}"
  APP_URL: "${CONSOLE_HOST:-https://localhost:4200}"
  SESSION_DOMAIN: "${SESSION_DOMAIN:-localhost}"
  LOG_CHANNEL: daily
  REGISTRY_HOST: https://registry.fleetbase.io
  REGISTRY_PREINSTALLED_EXTENSIONS: "true"
  OSRM_HOST: "${OSRM_HOST:-https://router.project-osrm.org}"

x-api: &api
  <<: *defaults
  image: ddmaps-portable-api:source
  platform: linux/amd64
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  volumes:
    - ./api/.env:/fleetbase/api/.env:ro
    - uploads:/fleetbase/api/storage/app
  environment: *api-env
  depends_on:
    database: {condition: service_healthy}
    cache: {condition: service_healthy}
    socket: {condition: service_healthy}

services:
  database:
    <<: *defaults
    image: mysql:8.0-oracle
    environment:
      MYSQL_ROOT_PASSWORD: "${DDMAPS_DB_ROOT_PASSWORD:?Run python portable/deploy.py init}"
      MYSQL_DATABASE: fleetbase
    volumes:
      - mysql-data:/var/lib/mysql
      - ./portable/generated/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  cache:
    <<: *defaults
    image: redis:4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  socket:
    <<: *defaults
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    environment:
      DDMAPS_SOCKET_AUTH_KEY: "${DDMAPS_SOCKET_AUTH_KEY:?Run python portable/deploy.py init}"
    volumes: ["./docker/socket/server.js:/usr/src/server.js:ro"]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:8000/health-check',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  application:
    <<: *api

  queue:
    <<: *api
    command: [php, artisan, "queue:work", "--tries=3", "--timeout=120"]
    healthcheck:
      test: [CMD, php, artisan, "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  scheduler:
    <<: *api
    command: [go-crond, --verbose, "root:./crontab"]
    healthcheck:
      test: [CMD, php, /usr/local/bin/check-scheduler-health.php]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  httpd:
    <<: *defaults
    image: ddmaps-portable-httpd:source
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    depends_on: [application]

  console:
    <<: *defaults
    image: ddmaps-portable-console:source
    build:
      context: .
      dockerfile: console/Dockerfile
      args:
        ENVIRONMENT: production
        ALPINE_MIRROR: "${BUILD_ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}"
        HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
        HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-}"
      secrets: [carto_api_key]
    ports:
      - "4200:4200"
      - "127.0.0.1:4201:8080"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json:ro
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portable/generated/tls:/etc/nginx/ssl
    depends_on: [httpd, socket]

  maintenance:
    <<: *api
    profiles: [tools]
    restart: "no"
    environment:
      <<: *api-env
      DATABASE_URL: "mysql://root:${DDMAPS_DB_ROOT_PASSWORD}@database/fleetbase"
    volumes:
      - ./api/.env:/fleetbase/api/.env:ro
      - uploads:/fleetbase/api/storage/app
      - ./portable:/opt/ddmaps-portable:ro
    command: [php, artisan, migrate, --force]

secrets:
  carto_api_key:
    file: ./portable/generated/carto-api-key.txt

volumes:
  mysql-data:
  redis-data:
  uploads:
