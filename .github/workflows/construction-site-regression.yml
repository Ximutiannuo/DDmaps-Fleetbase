name: Construction site regression
on:
  pull_request:
    paths: ['packages/construction-site/**', 'packages/ember-core/**', 'api/app/Exceptions/Handler.php', 'console/app/**', 'console/tests/**', 'docker/api/**', 'docker/socket/**', 'docker-compose.test.yml', 'scripts/regression.sh', 'scripts/grant-site-writer.php']
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: node --test console/tests/*.test.cjs
      - run: docker compose -p ddmaps-test -f docker-compose.test.yml up -d database cache socket --wait --wait-timeout 180
      - run: docker compose -p ddmaps-test -f docker-compose.test.yml run --rm --no-deps --build application php artisan migrate --force
      - run: docker compose -p ddmaps-test -f docker-compose.test.yml up -d application --wait --wait-timeout 180
      - run: docker compose -p ddmaps-test -f docker-compose.test.yml exec -T application sh /tmp/regression.sh
      - run: docker compose -p ddmaps-test -f docker-compose.test.yml exec -T socket node /usr/src/security-test.js
      - if: always()
        run: docker compose -p ddmaps-test -f docker-compose.test.yml down -v
